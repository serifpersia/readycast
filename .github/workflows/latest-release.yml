# You build the release APK, drop it on the `latest` release, and run this.
# It checks the APK file name: if the version matches the release title there
# is nothing new and it stops. Otherwise it rebuilds the whole `latest`
# release (release + tag) at the current commit, so the APK and the source
# code downloads are never stale.
name: roll-latest-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Roll the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          title=$(gh release view latest --json name -q .name)
          mapfile -t apks < <(gh release view latest --json assets -q '.assets[].name' | grep '\.apk$' || true)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK asset on the latest release. Upload one first, then re-run."
            exit 1
          fi
          new_ver=$(printf '%s\n' "${apks[@]}" | grep -oP 'readycast-\K[0-9]+\.[0-9]+\.[0-9]+(?=-)' | sort -V | tail -1)
          cur_ver=$(printf '%s' "$title" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "Release title: $title (v$cur_ver) / newest APK: v$new_ver"
          if [ "$new_ver" = "$cur_ver" ]; then
            echo "::notice::APK is still v$cur_ver, no new version. Aborting."
            exit 1
          fi
          new_apk=$(printf '%s\n' "${apks[@]}" | grep "readycast-$new_ver-" | head -1)
          mkdir -p carry
          gh release download latest --pattern "$new_apk" --dir carry/
          gh release delete latest --yes
          git tag -d latest || true
          git push origin --delete latest || true
          git tag latest "$SHA"
          git push origin latest
          gh release create latest "carry/$new_apk" --title "latest(v$new_ver)" --target "$SHA"
          echo "latest is now latest(v$new_ver) serving $new_apk at $SHA"
